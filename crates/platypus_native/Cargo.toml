[package]
name = "platypus_native"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
platypus_api = { path = "../platypus_api", default-features = false, features = ["glam", "quickjs"] }
platypus_engine_api = { path = "../platypus_engine_api" }
platypus_physics_api = { path = "../platypus_physics_api" }
platypus_render_api = { path = "../platypus_render_api" }
platypus_scene = { path = "../platypus_scene" }
platypus_scenes = { path = "../platypus_scenes" }
platypus_script = { path = "../platypus_script" }

[dev-dependencies]
platypus_math = { path = "../platypus_math" }
platypus_kinds = { path = "../platypus_kinds" }
rquickjs = "0.14.0"
serde_json = "1"
