[package]
name = "iron_app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
iron_audio = { path = "../iron_audio" }
iron_core = { path = "../iron_core" }
iron_physics = { path = "../iron_physics" }
iron_scene = { path = "../iron_scene" }
iron_platform = { path = "../iron_platform" }
iron_render = { path = "../iron_render" }
iron_script = { path = "../iron_script" }
iron_ui = { version = "0.1.0", path = "../iron_ui" }
iron_ui_native = { path = "../iron_ui_native" }
iron_native = { path = "../iron_native" }
iron_engine_api = { path = "../iron_engine_api" }
iron_scenes = { path = "../iron_scenes" }
iron_physics_api = { path = "../iron_physics_api" }
iron_render_api = { path = "../iron_render_api" }
iron_api = { path = "../iron_api" }
# The AOT compiler used as a JIT (its own workspace under tools/).
iron_ts = { path = "../../tools/iron_ts" }
iron_ts_rt = { path = "../../tools/iron_ts_rt" }
iron_ts_ui = { path = "../../tools/iron_ts_ui" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "ico"] }
notify = "8.2.0"
arboard = { version = "3.7.0", default-features = false }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
sys-locale = "0.3.2"
serde_json = "1.0.154"
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "KHR_materials_unlit", "KHR_materials_emissive_strength"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_Foundation"] }

# The editor (`src/bin/iron_editor.rs`): the same program loading the editor's UI.
# Its tests are iron_app's, so they don't run twice.
[[bin]]
name = "iron_editor"
test = false
