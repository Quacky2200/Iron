[package]
name = "iron_app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
iron_core = { path = "../iron_core" }
iron_platform = { path = "../iron_platform" }
iron_render = { path = "../iron_render" }
iron_script = { path = "../iron_script" }
iron_ui = { version = "0.1.0", path = "../iron_ui" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "ico"] }
arboard = { version = "3.7.0", default-features = false }
