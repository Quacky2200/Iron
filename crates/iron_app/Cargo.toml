[package]
name = "iron_app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
iron_audio = { path = "../iron_audio" }
iron_core = { path = "../iron_core" }
iron_physics = { path = "../iron_physics" }
iron_scene = { path = "../iron_scene" }
iron_platform = { path = "../iron_platform" }
iron_render = { path = "../iron_render" }
iron_script = { path = "../iron_script" }
iron_ui = { version = "0.1.0", path = "../iron_ui" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "ico"] }
notify = "8.2.0"
arboard = { version = "3.7.0", default-features = false }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
sys-locale = "0.3.2"
serde_json = "1.0.154"
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "KHR_materials_unlit", "KHR_materials_emissive_strength"] }
