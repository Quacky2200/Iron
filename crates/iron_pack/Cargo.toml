[package]
name = "iron_pack"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# Asset packs (`.irpk`): the container, its writer and reader, and the layered asset file system
# (loose folders and packs behind one interface). Design: docs/research/iron-asset-packs.md.
# Every dependency is already in the workspace's lock file.
[dependencies]
crc32fast = "1.5.2"
memmap2 = "0.9.11"
miniz_oxide = "0.9.1"
siphasher = "1.0.4"
iron_core = { path = "../iron_core" }
zstd = { version = "0.14.3", default-features = false }
tracing = "0.1.44"
