[package]
name = "iron_render"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
etagere = "0.3.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
iron_core = { version = "0.1.0", path = "../iron_core" }
iron_ui = { version = "0.1.0", path = "../iron_ui" }
png = "0.18.1"
resvg = { version = "0.48.1", default-features = false, features = ["text"] }
pollster = "1.0.1"
swash = "0.2.10"
thiserror = "2.0.21"
tracing = "0.1.44"
wgpu = "30.0.1"
lyon_tessellation = "1.0.22"

[dev-dependencies]
iron_core = { path = "../iron_core" }
