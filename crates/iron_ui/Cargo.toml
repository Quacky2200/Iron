# SPDX-License-Identifier: Apache-2.0

[package]
name = "iron_ui"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
wuff = "0.2.9"
cssparser = "0.38"
iron_core = { version = "0.1.0", path = "../iron_core" }
# complex-scripts: dictionary word and line breaks for CJK, Thai, Lao, Khmer and Burmese.
parley ={ version = "0.12.0", features = ["complex-scripts"] }
precomputed-hash = "0.1.1"
rustc-hash = "2.1.3"
selectors = "0.41"
taffy = { version = "0.15.0", features = ["parse", "float_layout"] }
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
criterion = "0.8.2"
iron_script = { path = "../iron_script" }
parley = { version = "0.12.0", features = ["complex-scripts"] }
serde_json = "1.0.154"

[[bench]]
name = "layout"
harness = false

[[bench]]
name = "restyle"
harness = false
