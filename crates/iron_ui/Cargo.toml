[package]
name = "iron_ui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
cssparser = "0.38"
iron_core = { version = "0.1.0", path = "../iron_core" }
parley = "0.12.0"
precomputed-hash = "0.1.1"
rustc-hash = "2.1.3"
selectors = "0.41"
taffy = { version = "0.15.0", features = ["parse"] }
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
criterion = "0.8.2"
iron_script = { path = "../iron_script" }
parley = "0.12.0"
serde_json = "1.0.154"

[[bench]]
name = "layout"
harness = false

[[bench]]
name = "restyle"
harness = false
