[package]
name = "iron_api"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["quickjs"]
# Typed QuickJS bindings (`register_quickjs`) generated by `#[iron_api(quickjs)]`.
quickjs = ["dep:rquickjs"]
# `ValueType` for glam's `Vec2`/`Vec3`/`Vec4`/`Quat`.
glam = ["dep:glam"]

[dependencies]
iron_api_macros = { version = "0.1.0", path = "../iron_api_macros" }
rquickjs = { version = "0.14.0", optional = true }
glam = { version = "0.34.1", optional = true }
