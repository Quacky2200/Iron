[package]
name = "platypus_render_cpu"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
platypus_core = { version = "0.1.0", path = "../platypus_core" }
platypus_ui = { version = "0.1.0", path = "../platypus_ui" }
raw-window-handle = "0.6"
resvg = { version = "0.48.1", default-features = false, features = ["text"] }
softbuffer = "0.4.8"
tracing = "0.1.44"
# Multithreaded rasterisation (a frame with layer filters uses one thread: vello_cpu's filters
# need it).
vello_common = "0.3.0"
vello_cpu = { version = "0.3.0", features = ["multithreading"] }
