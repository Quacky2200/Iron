[package]
name = "platypus_app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
# `platypus-game` (the default), `platypus-app` and `platypus_editor` are the same program told apart by
# their name (`host.rs`); `platypus-game` runs `project.json` projects of type `game`, `platypus-app`
# those of type `app`.
default-run = "platypus-game"
autobins = false

[dependencies]
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
platypus_audio = { path = "../platypus_audio" }
platypus_core = { path = "../platypus_core" }
platypus_physics = { path = "../platypus_physics" }
platypus_scene = { path = "../platypus_scene" }
platypus_platform = { path = "../platypus_platform" }
platypus_render = { path = "../platypus_render" }
platypus_render_gles = { path = "../platypus_render_gles" }
platypus_script = { path = "../platypus_script" }
platypus_ui = { version = "0.1.0", path = "../platypus_ui" }
platypus_ui_native = { path = "../platypus_ui_native" }
platypus_native = { path = "../platypus_native" }
platypus_engine_api = { path = "../platypus_engine_api" }
platypus_animation = { path = "../platypus_animation" }
platypus_scenes = { path = "../platypus_scenes" }
platypus_physics_api = { path = "../platypus_physics_api" }
platypus_render_api = { path = "../platypus_render_api" }
platypus_api = { path = "../platypus_api" }
platypus_kinds = { path = "../platypus_kinds" }
# The AOT compiler used as a JIT (its own workspace under tools/).
platypus_ts = { path = "../../tools/platypus_ts" }
platypus_ts_rt = { path = "../../tools/platypus_ts_rt" }
platypus_ts_ui = { path = "../../tools/platypus_ts_ui" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "ico"] }
notify = "8.2.0"
arboard = { version = "3.7.0", default-features = false }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
sys-locale = "0.3.2"
serde_json = "1.0.154"
platypus_pack = { path = "../platypus_pack" }
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "KHR_materials_unlit", "KHR_materials_emissive_strength"] }

# The build script turns resources/icon/icon.png into the window icon and the exe's icon.
[build-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }


# Games: the full engine (Vulkan / DX12 / Metal through wgpu, the 3D world).
[[bin]]
name = "platypus-game"
path = "src/main.rs"

# Apps: only UI, with a lighter renderer (`src/bin/platypus_ui_app.rs`: main.rs again, see `host.rs`).
[[bin]]
name = "platypus-app"
path = "src/bin/platypus_ui_app.rs"
test = false

# The editor (`src/bin/platypus_editor.rs`): the same program loading the editor's UI.
# Its tests are platypus_app's, so they don't run twice.
[[bin]]
name = "platypus_editor"
path = "src/bin/platypus_editor.rs"
test = false
