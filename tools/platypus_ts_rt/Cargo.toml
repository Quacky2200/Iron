[package]
name = "platypus_ts_rt"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
platypus_api = { path = "../../crates/platypus_api", default-features = false }
platypus_kinds = { path = "../../crates/platypus_kinds" }
platypus_physics_api = { path = "../../crates/platypus_physics_api" }
serde_json = "1"
regress = { version = "0.12.0", features = ["utf16"] }
jiff = "0.2"
icu = { version = "2", features = ["unstable"] }
fixed_decimal = { version = "0.7", features = ["ryu"] }
writeable = "0.6"
num-bigint = "0.4"
corosensei = "0.2"
num-traits = "0.2"
num-integer = "0.1"

[dev-dependencies]
