[package]
name = "platypus_build"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "platypus-build"
path = "src/main.rs"

[dependencies]
platypus_ts = { path = "../platypus_ts" }
platypus_ts_ui = { path = "../platypus_ts_ui" }
platypus_engine_api = { path = "../../crates/platypus_engine_api" }
platypus_scene = { path = "../../crates/platypus_scene" }
platypus_scenes = { path = "../../crates/platypus_scenes" }
platypus_physics_api = { path = "../../crates/platypus_physics_api" }
platypus_render_api = { path = "../../crates/platypus_render_api" }
serde_json = "1"
platypus_core = { path = "../../crates/platypus_core" }
platypus_pack = { path = "../../crates/platypus_pack" }
base64 = "0.23.1"
editpe = "0.2.4"
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }

[dev-dependencies]
oxc_allocator = "0.154.0"
oxc_ast = "0.154.0"
oxc_parser = "0.154.0"
oxc_span = "0.154.0"
