name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Software Vulkan (llvmpipe) for headless render tests; Windows uses WARP (DX12).
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libudev-dev libxkbcommon-dev

      - run: cargo fmt --all --check            # M1-BLD-02
      - run: cargo clippy --workspace --all-targets -- -D warnings  # M1-BLD-02
      - run: cargo build --workspace            # M1-BLD-01
      - run: cargo test --workspace

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build                      # M1-BLD-03
      - run: bun run typecheck                  # M1-BLD-04
      - run: bun test
      - name: Committed test fixtures match their TypeScript sources
        run: bun run build:fixtures && git diff --exit-code tests/fixtures
