# Pictures of every example, for checking by eye (`screenshots`) and for docs/PROGRESS.md
# (`progress-shots`). A member of the tools/ workspace that lives with the tests.
[package]
name = "platypus_shots"
workspace = "../../../tools"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "screenshots"
path = "src/bin/screenshots.rs"

[[bin]]
name = "progress-shots"
path = "src/bin/progress_shots.rs"

[dependencies]
platypus_build = { path = "../../../tools/platypus_build" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
