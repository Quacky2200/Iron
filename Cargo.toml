# SPDX-License-Identifier: Apache-2.0

[workspace]
resolver = "3"
members = ["crates/*"]

# Taffy 0.15.0 with a float fix (docs/upstream/taffy-float-tail.md); drop once upstream has it.
[patch.crates-io]
taffy = { path = "third_party/taffy" }

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

# Line tables only: full debug info made 185 PDBs of 8.6 GB; panics and backtraces still show lines.
[profile.dev]
debug = "line-tables-only"

# Dependencies (QuickJS, Parley, swash, wgpu, ...) are optimized even in debug builds:
# typing in a debug build otherwise takes ~25 ms per key in QuickJS alone. Iron's own
# crates stay unoptimized for debugging.
[profile.dev.package."*"]
opt-level = 3
